<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Runner in Browser</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        textarea { width: 100%; height: 200px; }
        button { margin-top: 10px; padding: 10px; }
        #output { margin-top: 20px; padding: 10px; border: 1px solid #ccc; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Run Python Code in Your Browser</h1>
    <p>Enter your Python code below and click "Run" to execute it using Pyodide.</p>
    <textarea id="code" placeholder="Enter Python code here...">
print("Hello, World!")
    </textarea>
    <br>
    <button id="runButton">Run</button>
    <div id="output"></div>

    <script>
        let pyodideReadyPromise;

        async function loadPyodideAndPackages() {
            let pyodide = await loadPyodide();
            await pyodide.loadPackage(['micropip']);
            return pyodide;
        }

        async function main() {
            pyodideReadyPromise = loadPyodideAndPackages();
        }

        main();

        document.getElementById('runButton').addEventListener('click', async () => {
            let pyodide = await pyodideReadyPromise;
            let code = document.getElementById('code').value;
            let output = document.getElementById('output');

            try {
                let result = await pyodide.runPythonAsync(code);
                output.textContent = result !== undefined ? result : 'No output';
                output.style.color = 'black';
            } catch (err) {
                output.textContent = err;
                output.style.color = 'red';
            }
        });
    </script>
</body>
</html>
