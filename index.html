<!DOCTYPE html>
<html>
<head>
    <title>Blooket Bot</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 40px; background: #f0f0f0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; text-align: center; color: #1a73e8; }
        input, select, button { width: 100%; margin: 8px 0; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { background: #1a73e8; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0b5cab; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 12px; background: #f8f9fa; border-radius: 8px; font-family: monospace; font-size: 14px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; border-left: 4px solid #1a73e8; }
        .footer { margin-top: 20px; font-size: 12px; text-align: center; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Blooket Bot</h1>
        <label>🎮 Game Code:</label>
        <input type="text" id="gameCode" placeholder="e.g., 123456">
        <label>👤 Your Name:</label>
        <input type="text" id="playerName" placeholder="Bot" value="AutoBot">
        <label>🧠 Answer Mode:</label>
        <select id="answerMode">
            <option value="first">Pick first answer (always works)</option>
            <option value="correct">Try to pick correct answer (if available)</option>
        </select>
        <button id="joinBtn">🚀 Join Game</button>
        <div id="status">Ready. Enter a game code and click Join.</div>
        <div class="footer">⚠️ This bot picks the first answer by default. For actual correct answers, you'd need an answer database. Use at your own risk.</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const joinBtn = document.getElementById('joinBtn');
        const gameCodeInput = document.getElementById('gameCode');
        const playerNameInput = document.getElementById('playerName');
        const answerModeSelect = document.getElementById('answerMode');
        const statusDiv = document.getElementById('status');

        joinBtn.addEventListener('click', () => {
            const gameCode = gameCodeInput.value.trim();
            if (!gameCode) {
                statusDiv.innerText = 'Please enter a game code.';
                return;
            }
            joinBtn.disabled = true;
            statusDiv.innerText = 'Joining...';
            socket.emit('join', {
                gameCode: gameCode,
                playerName: playerNameInput.value || 'Bot',
                answerMode: answerModeSelect.value
            });
        });

        socket.on('status', (data) => {
            statusDiv.innerText = data.message;
            if (data.message.includes('Game ended') || data.message.includes('Failed to join') || data.message.includes('Error')) {
                joinBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
