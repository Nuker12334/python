<!DOCTYPE html>
<html>
<head>
    <title>Blooket Bot</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f0f0f0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; margin: 8px 0; padding: 8px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        #status { margin-top: 20px; padding: 10px; background: #eee; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blooket Bot</h1>
        <label>Game Code:</label>
        <input type="text" id="gameCode" placeholder="e.g., 123456">
        <label>Your Name:</label>
        <input type="text" id="playerName" placeholder="Bot">
        <label>Answer Mode:</label>
        <select id="answerMode">
            <option value="first">Pick first answer</option>
            <option value="correct">Try to pick correct (if known)</option>
        </select>
        <button id="joinBtn">Join Game</button>
        <div id="status">Ready. Enter a game code and click Join.</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const joinBtn = document.getElementById('joinBtn');
        const gameCodeInput = document.getElementById('gameCode');
        const playerNameInput = document.getElementById('playerName');
        const answerModeSelect = document.getElementById('answerMode');
        const statusDiv = document.getElementById('status');

        joinBtn.addEventListener('click', () => {
            const gameCode = gameCodeInput.value.trim();
            if (!gameCode) {
                statusDiv.innerText = 'Please enter a game code.';
                return;
            }
            joinBtn.disabled = true;
            statusDiv.innerText = 'Joining...';
            socket.emit('join', {
                gameCode: gameCode,
                playerName: playerNameInput.value || 'Bot',
                answerMode: answerModeSelect.value
            });
        });

        socket.on('status', (data) => {
            statusDiv.innerText = data.message;
            if (data.message.includes('Game ended') || data.message.includes('Failed')) {
                joinBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
